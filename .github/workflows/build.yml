name: Build and publish
on:
  push:
    branches:
      - production
  pull_request:
    branches:
      - production
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
jobs:
  build:
    runs-on:
      - self-hosted
      - runner-vanilla
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Choose the image builder
        id: image-builder
        shell: bash
        run: "endpoints=($BUILDKIT_ENDPOINTS)\nif [ \"${#endpoints[@]}\" -eq 0 ] ||
          [ ! -r /etc/buildkit/certs/tls.crt ]; then\n  echo \"::error::This runner
          has no shared image builder (BUILDKIT_ENDPOINTS or its certificate is missing).\"\
          \n  exit 1\nfi\nchecksum=$(printf '%s' \"$GITHUB_REPOSITORY\" | cksum |
          cut -d ' ' -f 1)\nendpoint=${endpoints[$(( checksum % ${#endpoints[@]} ))]}\n\
          address=${endpoint#tcp://}\nif ! timeout 5 bash -c \"exec 3<>/dev/tcp/${address%:*}/${address##*:}\"\
          \ 2>/dev/null; then\n  echo \"::error::The shared image builder $endpoint
          cannot be reached. Run 'locus recovery'.\"\n  exit 1\nfi\necho \"endpoint=$endpoint\"\
          \ >> \"$GITHUB_OUTPUT\"\necho \"Shared image builder: $endpoint\"\n"
      - name: Use the shared image builder
        uses: docker/setup-buildx-action@v4
        with:
          driver: remote
          endpoint: ${{ steps.image-builder.outputs.endpoint }}
          driver-opts: "cacert=/etc/buildkit/certs/ca.crt\ncert=/etc/buildkit/certs/tls.crt\n\
            key=/etc/buildkit/certs/tls.key\n"
      - name: Login to Docker registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: registry.spraxs.nl
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Build Docker image, push it for a branch
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: registry.spraxs.nl/radioactive-server:${{ github.sha }}
      - name: Queue deployment in Locus
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v8
        env:
          LOCUS_API_URL: ${{ vars.LOCUS_API_URL }}
        with:
          script: "const environments = {\"production\": \"production\"};\nconst branch
            = context.ref.replace(/^refs\\/heads\\//, '');\nconst environment = environments[branch];\n\
            if (!environment) {\n  throw new Error(`Branch ${branch} belongs to no
            environment.`);\n}\nconst token = await core.getIDToken('locus-deployments');\n\
            const response = await fetch(\n  `${process.env.LOCUS_API_URL}/applications/radioactive-server/deployments`,\n\
            \  {\n    method: 'POST',\n    headers: {\n      Authorization: `Bearer
            ${token}`,\n      'Content-Type': 'application/json',\n    },\n    body:
            JSON.stringify({ revision: context.sha, environment }),\n  },\n);\nif
            (!response.ok) {\n  if (response.status === 404) {\n    throw new Error('Locus
            deployment API is not online yet. '      + 'Deploy the current Locus API
            first.');\n  }\n  throw new Error(`Locus rejected deployment: ${response.status}
            ${await response.text()}`);\n}\nconst deployment = await response.json();\n\
            core.info(`Deployment of ${environment} queued: ${deployment.check_run_id}`);"
